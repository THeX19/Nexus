[package]
name = "nexus"
version = "0.1.0"
description = "Local-First PC Command Center"
authors = ["Nexus Developer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
# Adding other dependencies from plan early
jwalk = "0.8"
portable-pty = "0.9"
reqwest = { version = "0.12", features = ["json"] }
trust-dns-resolver = "0.23"


[features]
default = ["custom-protocol"]
custom-protocol = []
